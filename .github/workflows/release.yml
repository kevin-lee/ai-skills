name: Release

on:
  push:
    tags:
      - '*'

env:
  GH_JAVA_VERSION: "21"
  GH_JAVA_DISTRIBUTION: "temurin"
  GH_SBT_OPTS: "-Xss64m -Xms2G -XX:MaxMetaspaceSize=2G -Xmx8G -XX:MaxInlineLevel=18 -XX:+UnlockExperimentalVMOptions"
  GH_JVM_OPTS: "-Xss64m -Xms2G -XX:MaxMetaspaceSize=2G -Xmx8G -XX:MaxInlineLevel=18 -XX:+UnlockExperimentalVMOptions -XX:+UseJVMCICompiler"
  PROJECT_NAME: "ai-skills"
  NATIVE_BIN_NAME: "aiskills"

jobs:

  release-precheck:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Check release tag and changelog"
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "Tag name: ${TAG_NAME}"
          echo "Version:  ${VERSION}"

          if ! echo "${TAG_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${TAG_NAME}' is not in the expected 'vMAJOR.MINOR.PATCH' form."
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          HEAD_COMMIT="$(git rev-parse "HEAD^{commit}")"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "::error::Tag '${TAG_NAME}' points at ${TAG_COMMIT} but HEAD is ${HEAD_COMMIT}, so sbt-dynver would not derive '${VERSION}'."
            exit 1
          fi

          CHANGELOG="changelogs/${VERSION}.md"
          if [ ! -f "${CHANGELOG}" ]; then
            echo "::error::Changelog '${CHANGELOG}' does not exist. Add it to the tagged commit, then delete and re-push the tag."
            exit 1
          fi
          if [ ! -s "${CHANGELOG}" ]; then
            echo "::error::Changelog '${CHANGELOG}' is empty."
            exit 1
          fi

          echo "OK: tag ${TAG_NAME} -> version ${VERSION}, changelog ${CHANGELOG} present"

  build:
    needs: release-precheck

    runs-on: ${{ matrix.os.value }}
    strategy:
      matrix:
        os:
          - { name: "macOS 26 Apple Silicon", value: "macOS-26",         bin-suffix: "-macos-26-arm64" }
          - { name: "macOS 15 Apple Silicon", value: "macos-15",         bin-suffix: "-macos-15-arm64" }
          - { name: "macOS 15 Intel",         value: "macos-15-intel",   bin-suffix: "-macos-15-intel" }
          - { name: "Ubuntu ARM64",           value: "ubuntu-24.04-arm", bin-suffix: "-linux-arm64" }
          - { name: "Ubuntu Latest (x86_64)", value: "ubuntu-latest",    bin-suffix: "-linux-x86_64" }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.GH_JAVA_VERSION }}
          distribution: ${{ env.GH_JAVA_DISTRIBUTION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: "Install LLVM and Clang (Ubuntu)"
        if: startsWith(matrix.os.value, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-12-dev

      - name: "Scala Native Build on ${{ matrix.os.name }} - ${{ github.run_number }}"
        env:
          CURRENT_BRANCH_NAME: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          JVM_OPTS: ${{ env.GH_JVM_OPTS }}
          SBT_OPTS: ${{ env.GH_SBT_OPTS }}
          APP_BIN_NAME: ${{ env.NATIVE_BIN_NAME }}${{ matrix.os.bin-suffix }}
        run: |
          echo "JVM_OPTS=${JVM_OPTS}"
          echo "SBT_OPTS=${SBT_OPTS}"
          sbt \
            -v \
            clean \
            test

  gh-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.GH_JAVA_VERSION }}
          distribution: ${{ env.GH_JAVA_DISTRIBUTION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: sbt GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JVM_OPTS: ${{ env.GH_JVM_OPTS }}
          SBT_OPTS: ${{ env.GH_SBT_OPTS }}
        run: |
          echo "Run] sbt GitHub release"
          echo "JVM_OPTS=${JVM_OPTS}"
          echo "SBT_OPTS=${SBT_OPTS}"
          sbt \
            devOopsGitHubRelease

  native-gh-release:
    needs: gh-release
    runs-on: ${{ matrix.os.value }}
    strategy:
      matrix:
        os:
          - { name: "macOS 26 Apple Silicon", value: "macOS-26",         bin-suffix: "-macos-26-arm64" }
          - { name: "macOS 15 Apple Silicon", value: "macos-15",         bin-suffix: "-macos-15-arm64" }
          - { name: "macOS 15 Intel",         value: "macos-15-intel",   bin-suffix: "-macos-15-intel" }
          - { name: "Ubuntu ARM64",           value: "ubuntu-24.04-arm", bin-suffix: "-linux-arm64" }
          - { name: "Ubuntu Latest (x86_64)", value: "ubuntu-latest",    bin-suffix: "-linux-x86_64" }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.GH_JAVA_VERSION }}
          distribution: ${{ env.GH_JAVA_DISTRIBUTION }}
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: "Install LLVM and Clang (Ubuntu)"
        if: startsWith(matrix.os.value, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-12-dev

      - name: "Scala Native Build and Upload on ${{ matrix.os.name }} - ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BRANCH_NAME: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          JVM_OPTS: ${{ env.GH_JVM_OPTS }}
          SBT_OPTS: ${{ env.GH_SBT_OPTS }}
          APP_BIN_NAME: ${{ env.NATIVE_BIN_NAME }}${{ matrix.os.bin-suffix }}
        run: |
          echo "JVM_OPTS=${JVM_OPTS}"
          echo "SBT_OPTS=${SBT_OPTS}"
          sbt \
            -v \
            clean \
            compile \
            cli/nativeLink
          
          NATIVE_BIN_DIR=$(ls -d modules/${{ env.PROJECT_NAME }}-cli/target/scala-*/)
          echo "NATIVE_BIN_DIR=${NATIVE_BIN_DIR}"

          echo "ls -lGh ${NATIVE_BIN_DIR}"
          ls -lGh "${NATIVE_BIN_DIR}"
          
          echo "Remove test app if exists: ${NATIVE_BIN_DIR}${{ env.NATIVE_BIN_NAME }}-test"
          rm -f "${NATIVE_BIN_DIR}${{ env.NATIVE_BIN_NAME }}-test"
          
          echo "mv ${NATIVE_BIN_DIR}${{ env.NATIVE_BIN_NAME }} ${NATIVE_BIN_DIR}${APP_BIN_NAME}"
          mv "${NATIVE_BIN_DIR}${{ env.NATIVE_BIN_NAME }}" "${NATIVE_BIN_DIR}${APP_BIN_NAME}"

          echo "ls -lGh ${NATIVE_BIN_DIR}"
          ls -lGh "${NATIVE_BIN_DIR}"

          "${NATIVE_BIN_DIR}${APP_BIN_NAME}" --version
          "${NATIVE_BIN_DIR}${APP_BIN_NAME}" --help

          sbt \
            devOopsGitHubReleaseUploadArtifacts
